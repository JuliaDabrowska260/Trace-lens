<title>Trace Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one full-screen stage (camera feed or white light table) with the reference image floating on it; a dark glass toolbar docks at the bottom. Single deliberate look in both themes. */
:root {
  --glass: rgba(22, 24, 30, 0.82);
  --glass-line: rgba(255, 255, 255, 0.12);
  --ink: #f3f1ec;
  --ink-dim: #a9a7a1;
  --accent: #ffb547;
  --accent-ink: #2a1a00;
  --paper: #ffffff;
  --grid: rgba(40, 90, 200, 0.28);
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
#cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
#ov {
  position: absolute; left: 50%; top: 50%;
  transform-origin: center center;
  max-width: none; pointer-events: none;
  will-change: transform, opacity;
}

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--glass-line);
  display: grid; gap: 10px;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.slider label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); min-width: 64px; }
.row.slider output { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; color: var(--ink); }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }

button, .filebtn {
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--glass-line);
  border-radius: 999px;
  padding: 10px 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
button[aria-pressed="true"] { background: rgba(255, 181, 71, 0.16); border-color: var(--accent); color: var(--accent); }
button.primary, .filebtn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.seg { display: inline-flex; border: 1px solid var(--glass-line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; padding: 8px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

#unlock {
  position: fixed; z-index: 6;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  background: var(--glass); border-color: var(--glass-line);
}
#toast {
  position: fixed; z-index: 7; left: 50%;
  top: calc(14px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  width: min(460px, calc(100% - 32px));
  background: var(--glass); color: var(--ink);
  border: 1px solid var(--glass-line); border-radius: 14px;
  padding: 12px 14px; font-size: 14px; line-height: 1.45;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
#toast b { color: var(--accent); }
.hint { font-size: 12px; color: var(--ink-dim); }
@media (prefers-reduced-motion: no-preference) {
  #toast { transition: opacity .25s; }
}
</style>

<div id="stage">
  <video id="cam" playsinline muted autoplay hidden></video>
  <div id="grid" hidden></div>
  <canvas id="ov"></canvas>
</div>

<div id="toast" hidden></div>
<button id="unlock" hidden>Unlock</button>

<div class="bar" id="bar">
  <div class="row slider">
    <label for="opacity">Opacity</label>
    <input id="opacity" type="range" min="5" max="100" value="45">
    <output id="opv">45%</output>
  </div>
  <div class="row">
    <label class="filebtn">Choose image<input id="file" type="file" accept="image/*"></label>
    <div class="seg" role="group" aria-label="Background">
      <button id="mLight" aria-pressed="true">Lightbox</button>
      <button id="mCam" aria-pressed="false">Camera</button>
    </div>
    <button id="bOutline" aria-pressed="false">Outline</button>
    <button id="bFlip" aria-pressed="false">Mirror</button>
    <button id="bGrid" aria-pressed="false">Grid</button>
    <button id="bReset">Reset</button>
    <button id="bLock">Lock</button>
  </div>
  <div class="hint">Drag to move · pinch to zoom and rotate · scroll wheel zooms, Shift+wheel rotates</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), ov = $('ov'), cam = $('cam'), toastEl = $('toast');
  const st = { x: 0, y: 0, s: 1, r: 0, flip: false, outline: false, locked: false, mode: 'light' };
  let src = null, outlined = null, stream = null, wake = null, toastT;

  function toast(html, ms = 6000) {
    toastEl.innerHTML = html; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, ms);
  }

  // ---- sample drawing so the tool opens in a working state ----
  function sample() {
    const c = document.createElement('canvas'); c.width = 900; c.height = 1000;
    const g = c.getContext('2d');
    g.strokeStyle = '#111'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
    const path = f => { g.beginPath(); f(); g.stroke(); };
    // big mushroom cap + stem
    path(() => { g.moveTo(170, 470); g.bezierCurveTo(170, 170, 640, 120, 680, 450); g.bezierCurveTo(560, 500, 290, 510, 170, 470); });
    path(() => { g.moveTo(360, 495); g.bezierCurveTo(340, 640, 330, 760, 300, 860); g.lineTo(510, 860); g.bezierCurveTo(480, 760, 470, 640, 470, 490); });
    path(() => { g.moveTo(360, 560); g.bezierCurveTo(390, 580, 440, 580, 472, 560); });
    // spots
    [[300, 330, 34], [450, 260, 44], [560, 380, 28], [390, 420, 22], [240, 420, 18]].forEach(([x, y, r]) => path(() => g.ellipse(x, y, r, r * .8, 0, 0, Math.PI * 2)));
    // small mushroom
    path(() => { g.moveTo(560, 660); g.bezierCurveTo(580, 540, 760, 540, 790, 660); g.closePath(); });
    path(() => { g.moveTo(645, 662); g.bezierCurveTo(640, 740, 640, 800, 625, 860); g.lineTo(712, 860); g.bezierCurveTo(700, 800, 700, 740, 700, 662); });
    // ground + grass
    path(() => { g.moveTo(110, 865); g.bezierCurveTo(350, 850, 600, 880, 830, 862); });
    [[150, 860, -20], [200, 862, 15], [560, 866, -10], [800, 860, 18], [250, 860, -6]].forEach(([x, y, d]) => path(() => { g.moveTo(x, y); g.quadraticCurveTo(x + d, y - 50, x + d * 1.6, y - 90); }));
    // leaf
    path(() => { g.moveTo(120, 820); g.bezierCurveTo(90, 720, 150, 650, 210, 640); g.bezierCurveTo(230, 720, 190, 800, 120, 820); g.moveTo(120, 820); g.quadraticCurveTo(160, 730, 210, 640); });
    return c;
  }

  // ---- outline (Sobel edges) ----
  function makeOutline(img) {
    const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * k), h = Math.round(img.height * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), p = d.data, gray = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const a = p[i * 4 + 3] / 255;
      gray[i] = (p[i * 4] * .299 + p[i * 4 + 1] * .587 + p[i * 4 + 2] * .114) * a + 255 * (1 - a);
    }
    const out = g.createImageData(w, h), o = out.data;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1] + gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];
      const gy = -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1] + gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];
      const m = Math.sqrt(gx * gx + gy * gy);
      const a = Math.max(0, Math.min(255, (m - 70) * 2));
      o[i * 4 + 3] = a; // black line on transparent
    }
    g.putImageData(out, 0, 0);
    return c;
  }

  function draw() {
    const img = st.outline ? (outlined ||= makeOutline(src)) : src;
    ov.width = img.width; ov.height = img.height;
    ov.getContext('2d').drawImage(img, 0, 0);
    apply();
  }
  function apply() {
    const sx = st.s * (st.flip ? -1 : 1);
    ov.style.transform = `translate(-50%,-50%) translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${sx},${st.s})`;
  }
  function fit() {
    const W = stage.clientWidth, H = stage.clientHeight - $('bar').offsetHeight;
    st.s = Math.min(W * .85 / ov.width, H * .85 / ov.height);
    st.x = 0; st.y = -$('bar').offsetHeight / 2; st.r = 0; apply();
  }
  function setImage(img) { src = img; outlined = null; draw(); fit(); }

  // ---- loading images ----
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) { toast('That file is not an image. Pick a JPG, PNG or WebP.'); return; }
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { setImage(im); URL.revokeObjectURL(url); };
    im.onerror = () => toast('That image could not be opened. Try another file.');
    im.src = url;
  }
  $('file').addEventListener('change', e => loadFile(e.target.files[0]));
  document.addEventListener('paste', e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (it) loadFile(it.getAsFile()); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  // ---- controls ----
  const opacity = $('opacity');
  opacity.addEventListener('input', () => { ov.style.opacity = opacity.value / 100; $('opv').textContent = opacity.value + '%'; });
  ov.style.opacity = .45;
  const toggle = (btn, key, after) => btn.addEventListener('click', () => { st[key] = !st[key]; btn.setAttribute('aria-pressed', st[key]); after && after(); });
  toggle($('bOutline'), 'outline', draw);
  toggle($('bFlip'), 'flip', apply);
  $('bGrid').addEventListener('click', () => { const g = $('grid'); g.hidden = !g.hidden; $('bGrid').setAttribute('aria-pressed', !g.hidden); });
  $('bReset').addEventListener('click', fit);

  async function lock(on) {
    st.locked = on; $('bar').hidden = on; $('unlock').hidden = !on;
    if (on) {
      try { wake = await navigator.wakeLock?.request('screen'); } catch (_) {}
      toast('Locked. The image stays put and the screen stays on. Tap <b>Unlock</b> to adjust.', 3500);
    } else { try { await wake?.release(); } catch (_) {} wake = null; }
  }
  $('bLock').addEventListener('click', () => lock(true));
  $('unlock').addEventListener('click', () => lock(false));

  function setMode(m) {
    st.mode = m;
    $('mLight').setAttribute('aria-pressed', m === 'light');
    $('mCam').setAttribute('aria-pressed', m === 'camera');
    cam.hidden = m !== 'camera';
  }
  $('mLight').addEventListener('click', () => {
    stream?.getTracks().forEach(t => t.stop()); stream = null; setMode('light');
    toast('<b>Lightbox:</b> turn screen brightness up, lay thin paper over the screen, lock, and trace.', 5000);
  });
  $('mCam').addEventListener('click', async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      cam.srcObject = stream; setMode('camera');
      toast('<b>Camera:</b> prop the phone above your paper, line up the image, lock it, then watch the screen while you draw.', 6000);
    } catch (e) {
      setMode('light');
      toast('The camera isn\'t available in this view. Use <b>Lightbox</b> instead: brightness up, paper on the screen, trace.', 7000);
    }
  });

  // ---- gestures ----
  const pts = new Map(); let prev = null;
  const two = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
  stage.addEventListener('pointerdown', e => { if (st.locked) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); prev = pts.size === 2 ? two() : null; });
  stage.addEventListener('pointermove', e => {
    if (st.locked || !pts.has(e.pointerId)) return;
    const old = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { st.x += e.clientX - old.x; st.y += e.clientY - old.y; }
    else if (pts.size === 2) {
      const cur = two();
      if (prev) { st.s *= cur.d / prev.d; st.r += cur.ang - prev.ang; st.x += cur.mx - prev.mx; st.y += cur.my - prev.my; }
      prev = cur;
    }
    apply();
  });
  const up = e => { pts.delete(e.pointerId); prev = pts.size === 2 ? two() : null; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => {
    e.preventDefault(); if (st.locked) return;
    if (e.shiftKey) st.r += e.deltaY * 0.002; else st.s *= Math.exp(-e.deltaY * 0.0015);
    apply();
  }, { passive: false });
  document.addEventListener('visibilitychange', async () => {
    if (st.locked && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock?.request('screen'); } catch (_) {} }
  });

  setImage(sample());
  window.addEventListener('resize', apply);
})();
</script>
